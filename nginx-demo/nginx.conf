events {}

http {
    server {
        listen 80;

        location / {
            return 200 "Hello from HTTP!\n";
        }
    }

    server {
        listen 443 ssl;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        location / {
            return 200 "Hello from HTTPS!\n";
        }
    }
}
