# Container image registry shared by both app images.
image:
  registry: europe-central2-docker.pkg.dev/project-f0ad4dfa-b194-4dc6-963/kubecourse
  pullPolicy: IfNotPresent

backend:
  image:
    # Default backend is the Go implementation (go-backend-project). The Spring
    # backend image ("backend") remains available for A/B swaps via --set.
    # NOTE: the Spring backend-project CD still runs on its own pushes; if it
    # triggers it will set backend.image.tag to a Spring SHA while reusing this
    # go-backend repository, producing a non-existent image. Avoid pushing to
    # the Spring repo while Go is the default.
    repository: go-backend
    tag: "a0ba0de"          # overridden per-deploy by the go-backend-project CD
  replicas: 1
  # Right-sized for the Go backend (idle ~1-3Mi). The Spring image needs far
  # more (~283Mi); if swapping back to Spring, raise these via --set.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
  # ConfigMap values (non-secret DB connection + CORS)
  config:
    dbHost: postgres
    dbPort: "5432"
    corsAllowedOrigins: https://todo.leventeprojects.xyz
  # Name of the pre-existing Secret (created via kubectl, not by this chart)
  dbSecretName: postgres-secret

frontend:
  image:
    repository: frontend
    tag: "a3149ff"          # overridden per-deploy by CD
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

postgres:
  image: postgres:16-alpine
  storage: 5Gi
  secretName: postgres-secret
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  host: todo.leventeprojects.xyz
  staticIpName: todo-ip
  clusterIssuer: letsencrypt-prod
  tlsSecretName: todo-leventeprojects-tls

monitoring:
  enabled: true

kafka:
  enabled: true
  image: apache/kafka:3.8.0
  storage: 1Gi
  heapOpts: "-Xmx512m -Xms512m"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 768Mi