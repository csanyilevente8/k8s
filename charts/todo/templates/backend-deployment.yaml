apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.image.registry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_PORT
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: CORS_ALLOWED_ORIGINS
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.dbSecretName }}
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.dbSecretName }}
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.dbSecretName }}
                  key: POSTGRES_DB
            {{- if .Values.kafka.enabled }}
            # Kafka event publishing + consumer. Both backends read KAFKA_BROKERS;
            # the Spring backend additionally needs APP_KAFKA_ENABLED=true to
            # start its consumer (the Go backend ignores it). Injected only when
            # kafka.enabled so the app runs without Kafka otherwise.
            - name: KAFKA_BROKERS
              value: "kafka-0.kafka.{{ .Release.Namespace }}.svc.cluster.local:9092"
            - name: APP_KAFKA_ENABLED
              value: "true"
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15