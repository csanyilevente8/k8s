apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo
  namespace: todo
  annotations:
    # Use the annotation form (not spec.ingressClassName) to match the working
    # nginx setup. This cluster has no IngressClass object named "gce", so the
    # GKE controller only claims Ingresses via this annotation.
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: todo-ip
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-edit-in-place: "true"
spec:
  tls:
    - hosts:
        - todo.leventeprojects.xyz
      secretName: todo-leventeprojects-tls   # cert-manager creates/fills this
  rules:
    - host: todo.leventeprojects.xyz
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend: #why backend?
              service:
                name: frontend
                port:
                  number: 80